{% extends 'base.html' %}
{% block content %}
<div class="max-w-3xl mx-auto bg-white border border-line rounded-2xl flex flex-col" style="height:75vh">
  <header class="px-4 py-3 border-b border-line font-semibold">{{ title }}</header>
  <div id="msgs" class="flex-1 overflow-y-auto p-4 space-y-2 text-sm">
    {% for m in messages %}
    <div><b>@{{ m.user.username }}</b> <span class="text-muted text-xs">{{ m.created_at|date:"H:i" }}</span><div>{{ m.text }}</div></div>
    {% endfor %}
  </div>
  <form id="form" class="border-t border-line p-3 flex gap-2">
    <input id="input" autocomplete="off" placeholder="Type a message" class="flex-1 border border-line rounded-lg px-3 py-2">
    <button class="px-4 py-2 rounded-lg bg-brand-500 text-white">Send</button>
  </form>
</div>
{% endblock %}
{% block scripts %}
<script>
const proto = location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${proto}://${location.host}/ws/chat/{{ room.slug }}/`);
const msgs = document.getElementById('msgs');
ws.onmessage = (e) => {
  const d = JSON.parse(e.data);
  const div = document.createElement('div');
  div.innerHTML = `<b>@${d.user}</b> <span class="text-muted text-xs">${new Date(d.created_at).toLocaleTimeString()}</span><div></div>`;
  div.lastChild.textContent = d.text;
  msgs.appendChild(div); msgs.scrollTop = msgs.scrollHeight;
};
document.getElementById('form').addEventListener('submit', (e) => {
  e.preventDefault();
  const v = document.getElementById('input').value.trim();
  if (!v) return;
  ws.send(JSON.stringify({action:'message', text:v}));
  document.getElementById('input').value = '';
});
msgs.scrollTop = msgs.scrollHeight;
</script>
{% endblock %}
