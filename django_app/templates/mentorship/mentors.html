{% extends 'base.html' %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Mentors (365-Day Club)</h1>
<div class="grid md:grid-cols-3 gap-4">
{% for m in mentors %}
<div class="bg-white border border-line rounded-2xl p-5">
  <div class="flex items-center gap-3">
    <div class="w-12 h-12 rounded-full bg-gradient-to-br from-amber-300 to-yellow-500 text-white flex items-center justify-center font-bold">{{ m.username|first|upper }}</div>
    <div>
      <a href="{% url 'accounts:public_profile' m.username %}" class="font-semibold">@{{ m.username }}</a>
      <div class="text-xs text-muted">🔥 {{ m.profile.current_streak }} · Longest {{ m.profile.longest_streak }}</div>
    </div>
  </div>
  <button onclick="fetch('{% url 'mentorship:request_mentor' m.id %}',{method:'POST',headers:{'X-CSRFToken':window.csrftoken}}).then(()=>alert('Request sent'))" class="mt-3 w-full py-2 rounded-lg bg-brand-500 text-white text-sm">Request mentorship</button>
</div>
{% empty %}<p class="text-muted">No mentors yet.</p>{% endfor %}
</div>
{% endblock %}
