{% extends 'base.html' %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Check-in history</h1>
<div class="bg-white border border-line rounded-2xl divide-y divide-line">
{% for c in checkins %}
<div class="p-4 flex justify-between text-sm">
  <div>{{ c.check_date }} · {{ c.habit.name }} <span class="text-muted">({{ c.category.name }})</span></div>
  <div>{{ c.get_status_display }} · score {{ c.verification_score }} · +{{ c.credits_awarded }}</div>
</div>
{% empty %}<div class="p-6 text-muted">No history yet.</div>{% endfor %}
</div>
{% endblock %}
