{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-white border border-line rounded-2xl p-8">
  <h1 class="text-2xl font-bold mb-6">Log in</h1>
  <form method="post" class="space-y-4">{% csrf_token %}
    <input class="w-full border border-line rounded-lg px-3 py-2" name="username" placeholder="Username" required>
    <input class="w-full border border-line rounded-lg px-3 py-2" name="password" type="password" placeholder="Password" required>
    <button class="w-full py-2 rounded-lg bg-brand-500 text-white font-medium">Log in</button>
  </form>
  <div class="mt-4 text-sm text-muted flex justify-between">
    <a href="{% url 'accounts:password_reset' %}">Forgot password?</a>
    <a href="{% url 'accounts:register' %}">Create account</a>
  </div>
  <div class="mt-6">
    <a href="/accounts/google/login/" class="block text-center w-full py-2 rounded-lg border border-line hover:bg-surface">Continue with Google</a>
  </div>
</div>
{% endblock %}
